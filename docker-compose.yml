services:
  dinkes-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dinkes_app
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/dinkes.db
      - UPLOADS_DIR=/data/uploads
      - DATA_ADMIN_ID=${DATA_ADMIN_ID:-bidangkesmas}
      - DATA_ADMIN_PASSWORD=${DATA_ADMIN_PASSWORD:-@Dinkes123#}
      - AUTH_SECRET=${AUTH_SECRET:-dinkes-auth-secret-key-2026}
    volumes:
      - dinkes_storage:/data
    restart: unless-stopped

volumes:
  dinkes_storage:
    name: dinkes_storage
