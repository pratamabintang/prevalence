<modal (requestClose)="onClearError()">
  <div
    class="relative w-full max-w-[480px] rounded-lg border border-slate-300 bg-white p-5 shadow-lg"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
  >
    <div class="flex items-center justify-between pb-3 border-b border-slate-200">
      <h3 class="text-sm font-semibold text-slate-900">Pemberitahuan Sistem</h3>
      <button
        type="button"
        class="inline-flex h-8 w-8 items-center justify-center rounded-md text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition-colors"
        aria-label="Tutup"
        (click)="onClearError()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 6l12 12" />
          <path d="M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div class="my-4 max-h-56 overflow-auto rounded-md bg-slate-50 p-3 border border-slate-200">
      @if (safeMessages().length > 1) {
        @for (msg of safeMessages(); track msg) {
          <div class="text-sm text-slate-700 leading-relaxed">{{ msg }}</div>
        }
      } @else {
        <p class="whitespace-pre-line text-sm text-slate-700 leading-relaxed break-words [overflow-wrap:anywhere]">
          {{ safeMessages()[0] }}
        </p>
      }
    </div>

    <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-200">
      <button
        type="button"
        class="inline-flex items-center justify-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50 transition-colors"
        (click)="copyError()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-3.5 w-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 9h10v10H9z" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        Salin
      </button>
      <button
        type="button"
        class="inline-flex items-center justify-center rounded-md bg-slate-800 px-3 py-1.5 text-xs font-medium text-white hover:bg-slate-700 transition-colors"
        (click)="onClearError()"
      >
        Tutup
      </button>
    </div>
  </div>
</modal>
